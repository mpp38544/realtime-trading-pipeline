version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - trading-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - trading-network

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    command:
      - bash
      - -ec
      - |
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          echo "Waiting for Kafka to become ready..."
          sleep 2
        done

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-ticks --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trading-signals --partitions 1 --replication-factor 1
        echo "Kafka topics are ready."
    restart: "no"
    networks:
      - trading-network

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
      POSTGRES_DB: tradingdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - trading-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - trading-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - trading-network

  api:
    build: ./api
    container_name: api
    depends_on:
      postgres:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - trading-network
    ports:
      - "8000:8000"

  producer:
    restart: always
    build: ./producer
    container_name: producer
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: 1
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - trading-network
    ports:
      - "8001:8001"

  signal-processor:
    restart: always
    build: ./signal-processor
    container_name: signal-processor
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - trading-network
    ports:
      - "8002:8002"

  order-executor:
    restart: always
    build: ./order-executor
    container_name: order-executor
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - trading-network
    ports:
      - "8003:8003"

  dashboard:
    build: ./dashboard
    container_name: dashboard
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - trading-network
    ports:
      - "5174:5174"

networks:
  trading-network:
    driver: bridge

volumes:
  postgres-data:
